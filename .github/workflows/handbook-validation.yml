name: Handbook validation
on:
  push:
    paths: ['ai-pm-handbook/**', '.github/workflows/handbook-validation.yml']
  pull_request:
    paths: ['ai-pm-handbook/**', '.github/workflows/handbook-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-pm-handbook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-pm-handbook/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run validate:mint
      - run: npm run links:mint
